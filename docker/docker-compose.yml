services:
  mongodb:

    image: mongo:7.0-jammy

    container_name: mongodb

    ports:
      - "27007:27017"

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

    volumes:
      - mongodb_data:/data/db

    networks:
      - backend

    restart: always

networks:
  backend:
    driver: bridge

volumes:
  mongodb_data: